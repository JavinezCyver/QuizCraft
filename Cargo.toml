[workspace]
members = ["server-rust", "src-tauri"]
default-members = ["server-rust"]
resolver = "2"

[profile.release]
lto = "thin"
strip = true

# Keep password hashing responsive even when the application uses debug builds.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
